name: AFTERROOM Behavioral QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app
          cat afterroom-v2/part-*.b64 | base64 -d > source.tar.gz
          tar -xzf source.tar.gz -C app
          cat afterroom-v2/motion-fix-*.b64 | base64 -d > motion.patch.gz
          gzip -d motion.patch.gz
          sed -i 's#afterroom-raw/#a/#g; s#afterroom-v2/room-that-learns-you-r3f-source/#b/#g' motion.patch
          cat afterroom-v2/behavior-v2-*.b64 | base64 -d > behavior.patch.gz
          gzip -d behavior.patch.gz
          sed -i 's#a/mnt/data/afterroom_motion_base/#a/#g; s#b/mnt/data/afterroom_full_test/#b/#g' behavior.patch
          cd app
          git apply --unsafe-paths --whitespace=nowarn ../motion.patch
          git apply --unsafe-paths --whitespace=nowarn ../behavior.patch

      - name: Install, type-check and build
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm run build

      - name: Verify requested behavior fixes
        run: |
          node <<'NODE'
          const fs = require('fs')
          const store = fs.readFileSync('app/src/state/roomStore.ts', 'utf8')
          const scene = fs.readFileSync('app/src/scene/RoomScene.tsx', 'utf8')
          const app = fs.readFileSync('app/src/App.tsx', 'utf8')
          const assert = (condition, message) => { if (!condition) throw new Error(message) }

          assert(store.includes('lastPointerMoveAt: number'), 'Missing pointer inactivity timestamp')
          assert(store.includes('(timestamp - lastPointerMoveAt) / 1000'), 'Stillness is not wall-clock based')
          assert(store.includes('pointerStillness > 1.35'), 'Door stillness threshold missing')
          assert(app.includes('onPointerEnter={() => setDoorFocused(true)}'), 'Door handle target does not activate focus')
          assert(app.includes('onPointerLeave={() => setDoorFocused(false)}'), 'Door handle target does not release focus')
          assert(store.includes('pointerStillness > 8.5'), 'Stillness secret threshold missing')
          assert(store.includes('meaningfulMovement && elapsedStillness > 8.5'), 'Stillness-end fallback missing')

          assert(store.includes('lastAggressiveAt: number'), 'Aggression timestamp missing')
          assert(store.includes('timestamp - misunderstanding.lastAggressiveAt > 4_500'), 'Avoidance repair delay missing')
          assert(store.includes('misunderstanding.progress + deltaSeconds * 0.022'), 'Passive repair rate missing')

          assert(scene.includes("lightWarm: new THREE.Color('#ff641f')"), 'Warm lamp colour missing')
          assert(scene.includes("heldObject === 'lamp' ? 1 : 0"), 'Held lamp warmth target missing')
          assert(scene.includes('light.current.color.copy(lampColors.lightBase).lerp(lampColors.lightWarm, warmth.current)'), 'Lamp light does not interpolate while held')
          assert(scene.includes('glowMaterial.current.color.copy(lampColors.glowBase).lerp(lampColors.glowWarm, warmth.current)'), 'Lamp glow does not interpolate while held')

          assert(store.includes('[...state.echoPath, ...state.currentPath]'), 'Full-session path merge missing')
          assert(!store.includes('slice(-72)'), 'Legacy 72-point persistence cap remains')
          assert(!store.includes('slice(-180)'), 'Legacy current-path cap remains')

          console.log(JSON.stringify({
            pass: true,
            checks: {
              trueStillnessDoor: true,
              stillnessSecret: true,
              stillnessEndFallback: true,
              avoidanceRepairs: true,
              lampWarmsWhileHeld: true,
              fullSessionCursorHistory: true,
              typescript: true,
              productionBuild: true
            }
          }, null, 2))
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: afterroom-verified-build-v2
          path: app/dist
